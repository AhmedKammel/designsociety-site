  <!-- Inline CSS fallback (لو assets/site.css مش موجود) -->
  <style id="ds-inline-css">
:root{
  --primary:#e50914;
  --bg:#141414;
  --bg2:#0b0b0b;
  --card:#1f1f1f;
  --muted:#a5a5a5;
  --border:#2a2a2a;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:14px;
  --radius-sm:10px;
  --maxw:1400px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:"Segoe UI", Tahoma, Arial, sans-serif;
  line-height:1.5;
}

a{color:inherit}
.container{max-width:var(--maxw); margin:0 auto; padding:0 18px;}

.topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(to bottom, rgba(0,0,0,.95), rgba(0,0,0,.75));
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.topbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
  padding:14px 0;
}
.brand{
  display:flex; flex-direction:column; gap:2px;
}
.brand h1, .brand h2{
  margin:0;
  font-size:1.2rem;
  color:var(--primary);
  letter-spacing:.2px;
}
.brand small{color:var(--muted); font-size:.85rem}

.actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.06);
  transition:.2s;
  font-weight:700;
  font-size:.92rem;
}
.btn:hover{transform:translateY(-1px); border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.09)}
.btn.primary{border-color:rgba(229,9,20,.55); background:rgba(229,9,20,.12)}
.btn.primary:hover{border-color:rgba(229,9,20,.8); background:rgba(229,9,20,.18)}

.search{
  width:min(520px, 100%);
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  padding:10px 14px;
  border-radius:999px;
}
.search input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-size:.98rem;
}
.search input::placeholder{color:rgba(255,255,255,.55)}
.badge{
  font-size:.78rem;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid rgba(229,9,20,.55);
  color:#fff;
  background:rgba(229,9,20,.12);
  white-space:nowrap;
}

.hero{
  background:linear-gradient(to bottom, #000, var(--bg));
  border-bottom:2px solid var(--primary);
  padding:56px 0 28px;
  text-align:center;
}
.hero h1{
  margin:0;
  font-size:3rem;
  color:var(--primary);
  letter-spacing:.4px;
}
.hero p{margin:10px 0 0; color:rgba(255,255,255,.78)}

.section{padding:18px 0 28px}
.meta-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap;
  color:var(--muted);
  font-size:.92rem;
  margin:10px 0 18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
  gap:16px;
}
@media (min-width: 720px){
  .grid{gap:22px; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));}
}
.card{
  background:linear-gradient(to bottom, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  transition:.18s;
  box-shadow:0 0 0 rgba(0,0,0,0);
}
.card:hover{
  transform:translateY(-6px);
  border-color:rgba(229,9,20,.55);
  box-shadow: var(--shadow);
}
.poster{
  position:relative;
  width:100%;
  padding-top:140%;
  background:#101010;
}
.poster img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .35s;
  filter:saturate(1.05);
}
.poster img.loaded{opacity:1}
.card-body{
  padding:12px 12px 14px;
  text-align:center;
}
.card-title{
  margin:0;
  font-weight:800;
  font-size:.98rem;
  color:#f1f1f1;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  min-height: 2.7em;
}
.card-sub{
  margin:8px 0 0;
  color:var(--muted);
  font-size:.86rem;
}

.pill-row{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:18px;}
.notice{
  width:100%;
  text-align:center;
  padding:18px 10px;
  color:var(--muted);
}
.skeleton{
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.04);
}
.skeleton .poster{background:rgba(255,255,255,.04)}
.skeleton .card-body{padding:12px}
.skeleton .line{
  height:12px; border-radius:8px;
  margin:10px auto 0;
  width:78%;
  background:rgba(255,255,255,.06);
}
.skeleton .line.sm{width:58%}
.shimmer{
  position:relative;
}
.shimmer:before{
  content:"";
  position:absolute; inset:-1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
  transform:translateX(-120%);
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer{to{transform:translateX(120%)}}

.player-wrap{
  background:linear-gradient(to bottom, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.cinema-screen{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.cinema-screen iframe{width:100%; height:100%; border:none;}
.servers-area{margin-top:18px; text-align:center}
.srv-list{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:10px;}
.srv-btn{
  background:rgba(255,255,255,.06);
  color:#ddd;
  border:1px solid rgba(255,255,255,.14);
  padding:10px 16px;
  cursor:pointer;
  border-radius:999px;
  font-weight:800;
  transition:.15s;
}
.srv-btn:hover{transform:translateY(-1px); background:rgba(255,255,255,.08)}
.srv-btn.active{
  background:rgba(229,9,20,.18);
  border-color:rgba(229,9,20,.55);
  color:#fff;
}

.telegram-float{
  position:fixed; bottom:20px; right:20px;
  background:linear-gradient(45deg, #229ED9, #1c79a8);
  color:white;
  padding:12px 22px;
  border-radius:999px;
  display:flex; align-items:center; gap:10px;
  text-decoration:none;
  box-shadow:0 5px 20px rgba(34, 158, 217, 0.5);
  z-index:1000; font-weight:900;
}
.telegram-float:hover{filter:brightness(1.05)}
.telegram-icon{width:24px; height:24px; fill:white}

.footer{
  padding:26px 0 40px;
  text-align:center;
  color:rgba(255,255,255,.55);
  font-size:.9rem;
}

.poster.thumb{padding-top:56.25%}


/* --- Safety for ads/embeds --- */
img, iframe, video { max-width: 100%; height: auto; }
iframe { display:block; }
body { overflow-x:hidden; }

  ],
  LATEST_EPISODES_JSON: "elmosalsal.json",
  TELEGRAM_URL: "https://t.me/qisatashk",
  PLACEHOLDER_POSTER: "https://via.placeholder.com/300x450/333/e50914?text=Design+Society",
  PLACEHOLDER_THUMB: "https://via.placeholder.com/300x180/333/e50914?text=Design+Society",

  <!-- Inline JS fallback (لو assets/site.js مش موجود) -->
  <script>
if(!window.DS){
// assets/site.js
(function () {
  "use strict";

  const CFG = window.DS_CONFIG || {};

  // -------------------------
  // Utils
  // -------------------------
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function cleanSeriesName(title) {
    if (!title) return "";
    let t = String(title);
    // إزالة "مسلسل" و "الحلقة ..." إن وجدت
    t = t.split("الحلقة")[0];
    t = t.replace("مسلسل", "").trim();
    return t;
  }

  // -------------------------
  // Fetch JSON with fallback + timeout
  // -------------------------
  async function fetchWithTimeout(url, { timeout = 12000 } = {}) {
    const ctrl = new AbortController();
    const id = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
      return res;
    } finally {
      clearTimeout(id);
    }
  }

  async function fetchJsonFromSources(urls) {
    let lastErr;
    for (const url of urls) {
      try {
        const res = await fetchWithTimeout(url, { timeout: 15000 });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (e) {
        lastErr = e;
        // تهدئة بسيطة لتجنب Rate limit
        await sleep(120);
      }
    }
    throw lastErr || new Error("Failed to fetch JSON");
  }

  // -------------------------
  // Image Proxy helpers
  // -------------------------
  function normalizeUrl(url) {
    if (!url) return "";
    let u = String(url).trim();
    if (u.startsWith("//")) u = "https:" + u;
    return u;
  }

  function stripProtocol(url) {
    // weserv تشتغل أفضل عندما يكون url بدون بروتوكول
    try {
      const u = new URL(url);
      return u.host + u.pathname + u.search;
    } catch {
      return url.replace(/^https?:\/\//, "");
    }
  }

  function buildImageCandidates(originalUrl, { w = 300, h = 450, fit = "cover" } = {}) {
    const url = normalizeUrl(originalUrl);
    if (!url) return [CFG.PLACEHOLDER_POSTER].filter(Boolean);

    const noProto = stripProtocol(url);

    // الترتيب: weserv -> wsrv -> direct
    const c1 = `https://images.weserv.nl/?url=${encodeURIComponent(noProto)}&w=${w}&h=${h}&fit=${fit}`;
    const c2 = `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=${w}&h=${h}&fit=${fit}`;
    const c3 = url;

    return [c1, c2, c3].filter(Boolean);
  }

  function attachProgressiveImage(img, candidates, placeholder) {
    let i = 0;
    img.referrerPolicy = "no-referrer";
    img.decoding = "async";
    img.loading = "lazy";

    function tryNext() {
      if (i >= candidates.length) {
        img.src = placeholder || CFG.PLACEHOLDER_POSTER || "";
        img.classList.add("loaded");
        return;
      }
      img.src = candidates[i++];
    }

    img.addEventListener("load", () => img.classList.add("loaded"), { once: true });
    img.addEventListener("error", () => tryNext());

    // start
    tryNext();
  }

  // -------------------------
  // Lazy load via IntersectionObserver
  // -------------------------
  const io = ("IntersectionObserver" in window)
    ? new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          const img = e.target;
          io.unobserve(img);
          const candidates = JSON.parse(img.dataset.candidates || "[]");
          const placeholder = img.dataset.placeholder || "";
          attachProgressiveImage(img, candidates, placeholder);
        }
      }, { rootMargin: "450px" })
    : null;

  function lazyMountImage(img, candidates, placeholder) {
    img.dataset.candidates = JSON.stringify(candidates);
    img.dataset.placeholder = placeholder || "";
    // ضع placeholder الآن لتجنب فراغ
    img.src = placeholder || CFG.PLACEHOLDER_POSTER || "";
    if (io) io.observe(img);
    else attachProgressiveImage(img, candidates, placeholder);
  }

  // -------------------------
  // Concurrency limit
  // -------------------------
  function pLimit(concurrency) {
    const queue = [];
    let activeCount = 0;

    const next = () => {
      activeCount--;
      if (queue.length > 0) {
        queue.shift()();
      }
    };

    const run = async (fn, resolve, reject) => {
      activeCount++;
      try {
        const result = await fn();
        resolve(result);
      } catch (error) {
        reject(error);
      } finally {
        next();
      }
    };

    return (fn) =>
      new Promise((resolve, reject) => {
        const task = () => run(fn, resolve, reject);
        if (activeCount < concurrency) task();
        else queue.push(task);
      });
  }

  // -------------------------
  // Public API
  // -------------------------
  window.DS = {
    CFG,
    $,
    $$,
    escapeHtml,
    cleanSeriesName,
    fetchJsonFromSources,
    buildImageCandidates,
    lazyMountImage,
    pLimit,
  };
})();

}

<body>

  <div class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <h2 id="ep-title" style="margin:0; font-size:1.05rem; color:#fff;">جاري التحضير…</h2>
        <small id="status-text">—</small>
      </div>

      <div class="actions">
        <a id="back-btn" class="btn" href="index.html">← رجوع</a>
      </div>
    </div>
  </div>

  <a href="https://t.me/qisatashk" target="_blank" class="telegram-float" rel="noopener">
    <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.62 0zm4.91 5.6c.04 0 .09.01.13.02.34.09.53.48.43.82l-2.4 11.2c-.05.23-.23.41-.46.46-.35.08-.7-.14-.78-.49l-1.4-5.6-4.6 3.4c-.2.15-.48.14-.66-.03-.18-.17-.22-.45-.1-.66L8.8 9.6l-4.5-1.4c-.33-.1-.52-.46-.42-.8.09-.31.4-.49.71-.41l12.26 4.6zM9.8 10.6l1.2 4.4.9-3.8z"/></svg>
    <span>انضم لقناتنا</span>
  </a>

  <div class="section">
    <div class="container">
      <div class="player-wrap">
        <div class="cinema-screen">
          <iframe id="player" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
        </div>
      </div>

      <div class="servers-area">
        <p style="color:rgba(255,255,255,.65); margin:14px 0 0;">سيرفرات المشاهدة:</p>
        <div id="srv-list" class="srv-list"></div>
      </div>

      <div id="error-box" class="notice" style="display:none;"></div>
    </div>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const CFG = window.DS_CONFIG;
    const DS = window.DS;

    const params = new URLSearchParams(location.search);
    const seriesId = params.get('id');
    const epNum = params.get('ep') ? parseInt(params.get('ep'), 10) : null;
    const src = params.get('src'); // latest
    const idx = params.get('i') ? parseInt(params.get('i'), 10) : null;
    const seriesName = params.get('name') ? decodeURIComponent(params.get('name')) : '';

    const epTitle = DS.$('#ep-title');
    const statusText = DS.$('#status-text');
    const backBtn = DS.$('#back-btn');
    const iframe = DS.$('#player');
    const list = DS.$('#srv-list');
    const errorBox = DS.$('#error-box');

    function setStatus(msg){ statusText.textContent = msg; }
    function showError(msg){
      errorBox.style.display = '';
      errorBox.textContent = msg;
    }

    function pickFirstStream(streams){
      if(!Array.isArray(streams) || !streams.length) return null;
      const active = streams.find(s => s && s.active);
      return active || streams[0];
    }

    function renderServers(streams){
      list.innerHTML = '';
      if(!Array.isArray(streams) || !streams.length){
        showError('لا توجد سيرفرات لهذه الحلقة.');
        return;
      }
      const first = pickFirstStream(streams);
      iframe.src = first.url || '';

      streams.forEach((s, i) => {
        const btn = document.createElement('button');
        btn.className = 'srv-btn' + ((s === first) ? ' active' : '');
        btn.type = 'button';
        btn.textContent = s.label || `سيرفر ${i+1}`;
        btn.onclick = () => {
          iframe.src = s.url || '';
          DS.$$('.srv-btn', list).forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        };
        list.appendChild(btn);
      });
    }

    async function loadFromSeries(){
      const sources = (CFG.SERIES_JSON_SOURCES || []).map(s => s.replace('{ID}', seriesId));
      const data = await DS.fetchJsonFromSources(sources);
      let ep = null;
      if(epNum != null) ep = data.find(e => Number(e.episode_number) === epNum);
      if(!ep && idx != null && data[idx]) ep = data[idx];
      return ep;
    }

    async function loadFromLatest(){
      const res = await fetch(CFG.LATEST_EPISODES_JSON, { cache:'no-store' });
      const data = await res.json();
      if(idx != null && data[idx]) return data[idx];
      if(epNum != null) return data.find(e => Number(e.episode_number) === epNum) || null;
      return data[0] || null;
    }

    async function init(){
      try{
        setStatus('جاري تحميل بيانات الحلقة…');

        // back behavior
        if(seriesId){
          backBtn.href = `episodes.html?id=${encodeURIComponent(seriesId)}&name=${encodeURIComponent(seriesName || '')}`;
          backBtn.textContent = '← قائمة الحلقات';
        }else{
          backBtn.href = 'series.html';
          backBtn.textContent = '← أحدث الحلقات';
        }

        let ep = null;
        if(seriesId){
          ep = await loadFromSeries();
        }else{
          ep = await loadFromLatest();
        }

        if(!ep){
          setStatus('لم يتم العثور على الحلقة');
          showError('تعذر العثور على بيانات الحلقة. تأكد من الرابط.');
          return;
        }

        epTitle.textContent = ep.title || 'مشاهدة الحلقة';
        setStatus('جاهز');

        renderServers(ep.streams || []);
      }catch(e){
        console.error(e);
        setStatus('فشل التحميل');
        showError('حدث خطأ أثناء تحميل الحلقة. حاول مرة أخرى لاحقاً.');
      }
    }

    init();
  </script>
