<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشاهدة الحلقة</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .player-container { max-width: 900px; margin: 20px auto; position: relative; padding-bottom: 56.25%; height: 0; border: 2px solid #333; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .controls { margin: 20px; }
        button { background: #333; color: white; border: none; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button.active { background: #e50914; }
        .nav { padding: 20px; text-align: right; max-width: 900px; margin: 0 auto; }
        a { color: #aaa; text-decoration: none; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="nav">
        <a href="series.html">← عودة للمسلسلات</a>
    </div>

    <h2 id="title">جاري التحميل...</h2>

    <div class="player-container">
        <iframe id="screen" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
    </div>

    <div class="controls" id="servers"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const epNum = parseInt(urlParams.get('ep'));

        fetch('elmosalsal.json')
            .then(r => r.json())
            .then(data => {
                const ep = data.find(e => e.episode_number === epNum);
                if(ep) {
                    document.getElementById('title').innerText = ep.title;
                    const frame = document.getElementById('screen');
                    const btns = document.getElementById('servers');
                    
                    // تشغيل أول سيرفر
                    frame.src = ep.streams[0].url;

                    ep.streams.forEach(s => {
                        const btn = document.createElement('button');
                        btn.innerText = s.label || 'سيرفر مشاهدة';
                        btn.onclick = () => {
                            frame.src = s.url;
                            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                        };
                        btns.appendChild(btn);
                    });
                }
            });
    </script>
    <script src="tracking.js"></script>
</body>
</html>
