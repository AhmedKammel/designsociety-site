<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاهدة الحلقة</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        /* الهيدر وزر العودة */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #333; color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 4px; transition: 0.3s; }
        .back-btn:hover { background: #e50914; }
        
        /* === حل مشكلة المشغل المربع === */
        .cinema-frame {
            width: 100%;
            /* هذا السطر هو السر: يجبر المتصفح على نسبة عرض 16:9 */
            aspect-ratio: 16 / 9; 
            background: #000;
            border-radius: 12px; /* حواف دائرية */
            overflow: hidden;
            box-shadow: 0 0 40px rgba(229, 9, 20, 0.3); /* ظل أحمر خفيف */
            border: 1px solid #333;
            position: relative;
        }
        
        iframe { width: 100%; height: 100%; border: none; }
        
        /* قائمة السيرفرات */
        .servers-box { margin-top: 30px; text-align: center; }
        .srv-title { color: #aaa; margin-bottom: 10px; font-size: 0.9rem; }
        .srv-btn {
            background: #222; color: #ccc; border: 1px solid #444;
            padding: 10px 20px; margin: 5px; cursor: pointer;
            border-radius: 4px; font-weight: bold; transition: 0.2s;
        }
        .srv-btn:hover, .srv-btn.active {
            background: #e50914; color: white; border-color: #e50914;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <h2 id="ep-title" style="margin:0">جاري التجهيز...</h2>
            <a href="#" id="back-link" class="back-btn">← عودة</a>
        </div>

        <div class="cinema-frame">
            <iframe id="screen" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
        </div>

        <div class="servers-box">
            <div class="srv-title">اختر سيرفر المشاهدة (إذا لم يعمل الأول):</div>
            <div id="servers-list"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const seriesId = params.get('id');
        const epNum = parseInt(params.get('ep'));

        document.getElementById('back-link').href = `episodes.html?id=${seriesId}`;

        async function init() {
            if(!seriesId) return;
            const url = `https://raw.githubusercontent.com/AhmedKammel/jsondata/refs/heads/main/mosalsal${seriesId}.json`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                const ep = data.find(e => e.episode_number === epNum);
                
                if(ep) {
                    document.getElementById('ep-title').innerText = ep.title;
                    const iframe = document.getElementById('screen');
                    const srvDiv = document.getElementById('servers-list');
                    
                    // تشغيل الافتراضي
                    iframe.src = ep.streams[0].url;

                    ep.streams.forEach((s, i) => {
                        const btn = document.createElement('button');
                        btn.className = 'srv-btn';
                        if(i === 0) btn.classList.add('active');
                        btn.innerText = s.label || `سيرفر ${i+1}`;
                        
                        btn.onclick = () => {
                            iframe.src = s.url;
                            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                        };
                        srvDiv.appendChild(btn);
                    });
                }
            } catch(e) {
                console.error(e);
            }
        }
        init();
    </script>
    <script src="tracking.js"></script>
</body>
</html>
