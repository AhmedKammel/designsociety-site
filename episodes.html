<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الحلقات</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        body { background: #141414; color: #fff; font-family: sans-serif; margin: 0; }
        header { padding: 20px; border-bottom: 2px solid #e50914; display:flex; justify-content:space-between; align-items:center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .ep-card { background: #222; border-radius: 5px; cursor: pointer; overflow: hidden; transition: 0.2s; text-align: center; }
        .ep-card:hover { background: #e50914; transform: translateY(-5px); }
        .ep-card img { width: 100%; height: 110px; object-fit: cover; }
        .ep-title { padding: 10px; font-weight: bold; }
        .btn { text-decoration: none; color: white; border: 1px solid white; padding: 5px 15px; border-radius: 4px; }
    </style>
</head>
<body>
    <header>
        <h2 id="s-title">جاري التحميل...</h2>
        <a href="index.html" class="btn">الرئيسية</a>
    </header>
    <div id="ep-grid" class="grid"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const name = params.get('name');
        if(name) document.getElementById('s-title').innerText = name;

        async function load() {
            if(!id) return;
            const url = `https://raw.githubusercontent.com/AhmedKammel/jsondata/refs/heads/main/mosalsal${id}.json`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                const container = document.getElementById('ep-grid');
                
                data.forEach(ep => {
                    const d = document.createElement('div');
                    d.className = 'ep-card';
                    d.onclick = () => window.location.href = `watch.html?id=${id}&ep=${ep.episode_number}`;
                    d.innerHTML = `
                        <img src="${ep.thumbnail}" onerror="this.src='https://via.placeholder.com/300x169/111/e50914'">
                        <div class="ep-title">حلقة ${ep.episode_number}</div>
                    `;
                    container.appendChild(d);
                });
            } catch(e) {}
        }
        load();
    </script>
    <script src="tracking.js"></script>
</body>
</html>
