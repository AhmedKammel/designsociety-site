<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحلقات</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        body { background-color: #141414; color: white; font-family: sans-serif; margin: 0; }
        header { padding: 20px; border-bottom: 2px solid #e50914; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #fff; text-decoration: none; border: 1px solid #fff; padding: 5px 15px; border-radius: 4px; }
        
        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        
        .ep-card { background: #333; border-radius: 5px; cursor: pointer; transition: 0.2s; text-align: center; overflow: hidden; }
        .ep-card:hover { background: #e50914; }
        .ep-card img { width: 100%; height: 100px; object-fit: cover; opacity: 0.7; }
        .ep-title { padding: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h2 id="series-title">جاري التحميل...</h2>
        <a href="index.html" class="back-btn">العودة للرئيسية</a>
    </header>

    <div id="ep-grid" class="episodes-grid"></div>

    <script>
        // جلب رقم الملف (ID) واسم المسلسل من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const seriesId = urlParams.get('id');
        const seriesName = urlParams.get('name');

        if(seriesName) document.getElementById('series-title').innerText = seriesName;

        async function loadEpisodes() {
            if (!seriesId) return;
            const url = `https://raw.githubusercontent.com/AhmedKammel/jsondata/refs/heads/main/mosalsal${seriesId}.json`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                const container = document.getElementById('ep-grid');
                
                data.forEach(ep => {
                    const div = document.createElement('div');
                    div.className = 'ep-card';
                    // نرسل رقم الملف + رقم الحلقة لصفحة المشاهدة
                    div.onclick = () => window.location.href = `watch.html?id=${seriesId}&ep=${ep.episode_number}`;
                    
                    div.innerHTML = `
                        <img src="${ep.thumbnail}" loading="lazy">
                        <div class="ep-title">حلقة ${ep.episode_number}</div>
                    `;
                    container.appendChild(div);
                });

            } catch (err) {
                console.error(err);
                document.getElementById('series-title').innerText = "خطأ في تحميل الحلقات";
            }
        }
        loadEpisodes();
    </script>
    <script src="tracking.js"></script>
</body>
</html>
