<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسلسلات التركية</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        body { background-color: #141414; color: #fff; font-family: sans-serif; margin: 0; }
        header { background: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e50914; }
        .back-btn { text-decoration: none; color: #fff; font-weight: bold; padding: 5px 15px; border: 1px solid #fff; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #222; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: scale(1.03); z-index: 2; box-shadow: 0 0 15px rgba(229, 9, 20, 0.6); }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .info { padding: 10px; }
        .ep-badge { position: absolute; top: 10px; right: 10px; background: #e50914; padding: 3px 8px; font-size: 0.8rem; border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <h2 style="margin:0; color:#e50914">قسم الدراما التركية</h2>
        <a href="index.html" class="back-btn">الرئيسية</a>
    </header>

    <div id="content" class="grid">
        <h3 style="text-align:center; width:100%">جاري تحميل الحلقات...</h3>
    </div>

    <script>
        async function loadData() {
            try {
                // جلب ملف JSON الخاص بك
                const res = await fetch('elmosalsal.json');
                const data = await res.json();
                
                const container = document.getElementById('content');
                container.innerHTML = '';

                data.forEach(ep => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => window.location.href = `watch.html?ep=${ep.episode_number}`;
                    
                    card.innerHTML = `
                        <div class="ep-badge">حلقة ${ep.episode_number}</div>
                        <img src="${ep.thumbnail}" loading="lazy">
                        <div class="info">
                            <h4 style="margin:0; font-size:0.9rem">${ep.title}</h4>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('content').innerText = 'حدث خطأ في تحميل البيانات';
            }
        }
        loadData();
    </script>
    
    <script src="tracking.js"></script>
</body>
</html>
