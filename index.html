<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Society - أحدث المسلسلات</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        :root { --primary: #e50914; --dark: #141414; }
        body { background-color: var(--dark); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        /* Hero Section */
        .hero { text-align: center; padding: 40px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), var(--dark)); border-bottom: 2px solid var(--primary); }
        .hero h1 { color: var(--primary); margin: 0; font-size: 2.5rem; }
        
        /* Grid System */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        
        /* Series Card */
        .card { background: #222; border-radius: 8px; overflow: hidden; transition: transform 0.3s; cursor: pointer; position: relative; border: 1px solid #333; }
        .card:hover { transform: scale(1.05); border-color: var(--primary); z-index: 10; }
        .card img { width: 100%; height: 260px; object-fit: cover; background: #333; } /* Placeholder color */
        .card-content { padding: 10px; text-align: center; }
        .card-title { font-size: 0.95rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Loading */
        .loading { text-align: center; padding: 20px; color: #777; width: 100%; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Design Society Drama</h1>
        <p>مكتبة المسلسلات الحصرية (137 مسلسل)</p>
    </div>

    <div class="container">
        <div id="series-grid" class="grid">
            <div class="loading">جاري تحميل المكتبة...</div>
        </div>
    </div>

    <script>
        // 1. توليد قائمة الروابط (من 1 إلى 137)
        const totalSeries = 137;
        const baseUrl = "https://raw.githubusercontent.com/AhmedKammel/jsondata/refs/heads/main/mosalsal{ID}.json";
        
        const grid = document.getElementById('series-grid');

        // دالة لجلب وعرض مسلسل واحد
        async function fetchAndDisplay(id) {
            try {
                const url = baseUrl.replace('{ID}', id);
                const response = await fetch(url);
                if (!response.ok) return; // تخطي الملفات التالفة

                const data = await response.json();
                
                // بما أن ملف JSON عبارة عن مصفوفة حلقات، نأخذ الحلقة الأولى كعينة للبيانات (الصورة والاسم)
                const firstEpisode = data[0]; 
                
                // استخراج اسم المسلسل (إزالة كلمة "الحلقة 1" وما بعدها)
                let seriesName = firstEpisode.title;
                // محاولة تنظيف الاسم (اختياري حسب شكل الداتا)
                seriesName = seriesName.split('الحلقة')[0].replace('مسلسل', '').trim();

                const card = document.createElement('div');
                card.className = 'card';
                // نرسل رقم الملف (ID) لصفحة الحلقات
                card.onclick = () => window.location.href = `episodes.html?id=${id}&name=${encodeURIComponent(seriesName)}`;
                
                card.innerHTML = `
                    <img src="${firstEpisode.thumbnail}" alt="${seriesName}" loading="lazy">
                    <div class="card-content">
                        <h3 class="card-title">${seriesName}</h3>
                    </div>
                `;
                return card;

            } catch (error) {
                console.error(`Error loading series ${id}`, error);
                return null;
            }
        }

        async function loadAllSeries() {
            grid.innerHTML = ''; // مسح التحميل

            // سنقوم بتحميلهم على دفعات لتسريع الصفحة (Batch Processing)
            const batchSize = 10; // تحميل 10 مسلسلات في كل مرة
            
            for (let i = 1; i <= totalSeries; i += batchSize) {
                const promises = [];
                for (let j = i; j < i + batchSize && j <= totalSeries; j++) {
                    promises.push(fetchAndDisplay(j));
                }
                
                // انتظار الدفعة الحالية
                const results = await Promise.all(promises);
                
                // إضافة الكروت الناجحة للشبكة
                results.forEach(card => {
                    if (card) grid.appendChild(card);
                });
            }
        }

        loadAllSeries();
    </script>
    
    <script src="tracking.js"></script>
</body>
</html>
