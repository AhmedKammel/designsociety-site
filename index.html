<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Society</title>
  <meta name="color-scheme" content="dark" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100">
  <header class="border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-xl font-bold">Design Society</h1>
        <p class="text-slate-400 text-sm">بوابة العضو</p>
      </div>
      <a href="admin.html" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold">
        لوحة الإدارة
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <section id="loginBox" class="max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 mx-auto">
      <h2 class="text-lg font-bold">تسجيل الدخول</h2>
      <p class="text-slate-400 text-sm mt-1">ادخل البريد الإلكتروني وكلمة المرور</p>

      <div class="mt-4 space-y-3">
        <input id="email" type="email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2" placeholder="البريد الإلكتروني" />
        <input id="pass" type="password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2" placeholder="كلمة المرور" />
        <button id="loginBtn" class="w-full px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 font-semibold">دخول</button>
        <p id="loginMsg" class="text-sm text-red-400"></p>
      </div>
    </section>

    <section id="dash" class="hidden space-y-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div>
          <h2 class="text-lg font-bold" id="memberName">—</h2>
          <p class="text-slate-400 text-sm" id="memberGroup">—</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button id="refreshBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-semibold">تحديث</button>
          <button id="logoutBtn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-sm font-semibold">خروج</button>
        </div>
      </div>

      <div class="grid md:grid-cols-4 gap-3">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <p class="text-slate-400 text-sm">السن</p>
          <p class="text-2xl font-bold mt-1" id="ageKpi">—</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <p class="text-slate-400 text-sm">ميعاد التجديد</p>
          <p class="text-2xl font-bold mt-1" id="renewKpi">—</p>
          <p class="text-slate-500 text-xs mt-1" id="renewHint">—</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <p class="text-slate-400 text-sm">المديونية</p>
          <p class="text-2xl font-bold mt-1" id="debtKpi">—</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <p class="text-slate-400 text-sm">الحالة</p>
          <p class="text-2xl font-bold mt-1" id="statusKpi">—</p>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <h3 class="font-bold">وصف الحالة</h3>
        <p class="text-slate-300 mt-2 whitespace-pre-wrap" id="noteBox">—</p>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <h3 class="font-bold">الدفعات</h3>
          <span class="text-slate-500 text-xs" id="updatedAt">—</span>
        </div>

        <div class="mt-3 overflow-auto border border-slate-800 rounded-2xl">
          <table class="min-w-[600px] w-full text-sm">
            <thead class="bg-slate-950">
              <tr>
                <th class="text-right p-3">التاريخ</th>
                <th class="text-right p-3">المبلغ</th>
              </tr>
            </thead>
            <tbody id="payRows" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="./crypto.js"></script>
  <script src="./user.js"></script>
</body>
</html>
