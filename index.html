<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عرض البيانات</title>
</head>
<body>

    <h1>البيانات المستوردة</h1>
    <div id="data-container">جاري التحميل...</div>

    <script>
        // رابط المصدر الذي تريد جلب البيانات منه
        const apiUrl = 'https://aa.3ick.net/';

        // دالة لجلب البيانات
        async function fetchData() {
            try {
                const response = await fetch(apiUrl);
                
                // التأكد من أن الرابط يعمل
                if (!response.ok) {
                    throw new Error('حدث خطأ في الاتصال بالمصدر');
                }

                // تحويل البيانات لـ JSON (لو كانت البيانات نصية فقط استخدم .text())
                const data = await response.json();

                // عرض البيانات في الموقع (عدل هذا الجزء حسب شكل الداتا)
                document.getElementById('data-container').innerText = JSON.stringify(data, null, 2);
                
                // طباعة البيانات في الكونسول للمراجعة
                console.log(data);

            } catch (error) {
                console.error('فشل جلب البيانات:', error);
                document.getElementById('data-container').innerText = 'فشل التحميل، تأكد من الـ Console';
            }
        }

        // تشغيل الدالة
        fetchData();
    </script>
</body>
</html>
