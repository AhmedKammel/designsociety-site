<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Society - الرئيسية</title>
    <style>
        body { margin: 0; background: #141414; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero { height: 60vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://wallpaperaccess.com/full/1202053.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; text-align: center; flex-direction: column; }
        .hero h1 { font-size: 3.5rem; color: #e50914; margin-bottom: 10px; }
        .sections { padding: 40px; display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .card { width: 300px; background: #1f1f1f; border-radius: 10px; overflow: hidden; transition: 0.3s; cursor: pointer; text-decoration: none; color: white; border: 1px solid #333; }
        .card:hover { transform: translateY(-10px); border-color: #e50914; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 20px; text-align: center; }
        .card h3 { margin: 0; font-size: 1.5rem; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Design Society</h1>
        <p>مجتمعك الأول للترفيه والتصميم</p>
    </div>

    <h2 style="text-align: center; margin-top: 40px; color: #aaa;">تصفح الأقسام</h2>

    <div class="sections">
        <a href="series.html" class="card">
            <img src="https://i.pinimg.com/736x/8f/c3/0f/8fc30f550e4e548238517228d7524945.jpg" alt="مسلسلات تركية">
            <div class="card-body">
                <h3>المسلسلات التركية</h3>
                <p>أحدث الحلقات مترجمة وحصرية</p>
            </div>
        </a>

        <a href="#" class="card" style="opacity: 0.5;">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" alt="Gaming">
            <div class="card-body">
                <h3>مجتمع الجيمرز</h3>
                <p>قريباً...</p>
            </div>
        </a>
    </div>

    <script src="tracking.js"></script>
</body>
</html>
