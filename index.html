<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>الحلقات</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        body { background: #141414; color: #fff; font-family: sans-serif; margin: 0; }
        
        header { 
            padding: 20px; border-bottom: 2px solid #e50914; 
            display: flex; justify-content: space-between; align-items: center; background: #000;
        }
        .btn-back { color: #fff; text-decoration: none; border: 1px solid #fff; padding: 6px 15px; border-radius: 4px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .ep-card { 
            background: #222; border-radius: 6px; overflow: hidden; 
            cursor: pointer; transition: 0.2s; text-align: center; border: 1px solid #333;
        }
        .ep-card:hover { background: #e50914; transform: translateY(-5px); }
        
        .ep-img { width: 100%; height: 100px; object-fit: cover; background: #000; }
        .ep-title { padding: 10px; font-weight: bold; font-size: 0.9rem; }

        /* نفس زر التيليجرام */
        .telegram-float {
            position: fixed; bottom: 20px; right: 20px;
            background: linear-gradient(45deg, #229ED9, #1c79a8);
            color: white; padding: 12px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; box-shadow: 0 5px 20px rgba(34, 158, 217, 0.5);
            z-index: 1000; font-weight: bold;
        }
        .telegram-icon { width: 24px; height: 24px; fill: white; }
    </style>
</head>
<body>
    
    <header>
        <h2 id="s-title" style="margin:0; font-size:1.2rem;">جاري التحميل...</h2>
        <a href="index.html" class="btn-back">الرئيسية</a>
    </header>

    <a href="https://t.me/qisatashk" target="_blank" class="telegram-float">
        <svg class="telegram-icon" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.62 0zm4.91 5.6c.04 0 .09.01.13.02.34.09.53.48.43.82l-2.4 11.2c-.05.23-.23.41-.46.46-.35.08-.7-.14-.78-.49l-1.4-5.6-4.6 3.4c-.2.15-.48.14-.66-.03-.18-.17-.22-.45-.1-.66L8.8 9.6l-4.5-1.4c-.33-.1-.52-.46-.42-.8.09-.31.4-.49.71-.41l12.26 4.6zM9.8 10.6l1.2 4.4.9-3.8z"/></svg>
        <span>تابع جديد الحلقات</span>
    </a>

    <div id="content" class="grid"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const name = params.get('name');
        if(name) document.getElementById('s-title').innerText = name;

        async function load() {
            if(!id) return;
            try {
                const res = await fetch(`https://raw.githubusercontent.com/AhmedKammel/jsondata/refs/heads/main/mosalsal${id}.json`);
                const data = await res.json();
                const box = document.getElementById('content');
                
                data.forEach(ep => {
                    const div = document.createElement('div');
                    div.className = 'ep-card';
                    div.onclick = () => window.location.href = `watch.html?id=${id}&ep=${ep.episode_number}`;
                    
                    // استخدام weserv للصور المصغرة للحلقات أيضاً
                    let thumb = ep.thumbnail.replace(/^https?:\/\//, '');
                    let proxyThumb = `https://images.weserv.nl/?url=${encodeURIComponent(thumb)}&w=300&h=180&fit=cover`;

                    div.innerHTML = `
                        <img class="ep-img" src="${proxyThumb}" onerror="this.src='https://via.placeholder.com/300x180/333/e50914'">
                        <div class="ep-title">حلقة ${ep.episode_number}</div>
                    `;
                    box.appendChild(div);
                });
            } catch(e) {}
        }
        load();
    </script>
</body>
</html>
