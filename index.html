<html lang="ar" dir="rtl">
<head>

  <!-- Inline CSS fallback (لو assets/site.css مش موجود) -->
  <style id="ds-inline-css">
:root{
  --primary:#e50914;
  --bg:#141414;
  --bg2:#0b0b0b;
  --card:#1f1f1f;
  --muted:#a5a5a5;
  --border:#2a2a2a;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --radius:14px;
  --radius-sm:10px;
  --maxw:1400px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:"Segoe UI", Tahoma, Arial, sans-serif;
  line-height:1.5;
}

a{color:inherit}
.container{max-width:var(--maxw); margin:0 auto; padding:0 18px;}

.topbar{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(to bottom, rgba(0,0,0,.95), rgba(0,0,0,.75));
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.topbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px;
  padding:14px 0;
}
.brand{
  display:flex; flex-direction:column; gap:2px;
}
.brand h1, .brand h2{
  margin:0;
  font-size:1.2rem;
  color:var(--primary);
  letter-spacing:.2px;
}
.brand small{color:var(--muted); font-size:.85rem}

.actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:9px 14px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.06);
  transition:.2s;
  font-weight:700;
  font-size:.92rem;
}
.btn:hover{transform:translateY(-1px); border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.09)}
.btn.primary{border-color:rgba(229,9,20,.55); background:rgba(229,9,20,.12)}
.btn.primary:hover{border-color:rgba(229,9,20,.8); background:rgba(229,9,20,.18)}

.search{
  width:min(520px, 100%);
  display:flex; align-items:center; gap:10px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  padding:10px 14px;
  border-radius:999px;
}
.search input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:#fff;
  font-size:.98rem;
}
.search input::placeholder{color:rgba(255,255,255,.55)}
.badge{
  font-size:.78rem;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid rgba(229,9,20,.55);
  color:#fff;
  background:rgba(229,9,20,.12);
  white-space:nowrap;
}

.hero{
  background:linear-gradient(to bottom, #000, var(--bg));
  border-bottom:2px solid var(--primary);
  padding:56px 0 28px;
  text-align:center;
}
.hero h1{
  margin:0;
  font-size:3rem;
  color:var(--primary);
  letter-spacing:.4px;
}
.hero p{margin:10px 0 0; color:rgba(255,255,255,.78)}

.section{padding:18px 0 28px}
.meta-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; flex-wrap:wrap;
  color:var(--muted);
  font-size:.92rem;
  margin:10px 0 18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
  gap:16px;
}
@media (min-width: 720px){
  .grid{gap:22px; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));}
}
.card{
  background:linear-gradient(to bottom, rgba(255,255,255,.06), rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  transition:.18s;
  box-shadow:0 0 0 rgba(0,0,0,0);
}
.card:hover{
  transform:translateY(-6px);
  border-color:rgba(229,9,20,.55);
  box-shadow: var(--shadow);
}
.poster{
  position:relative;
  width:100%;
  padding-top:140%;
  background:#101010;
}
.poster img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .35s;
  filter:saturate(1.05);
}
.poster img.loaded{opacity:1}
.card-body{
  padding:12px 12px 14px;
  text-align:center;
}
.card-title{
  margin:0;
  font-weight:800;
  font-size:.98rem;
  color:#f1f1f1;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  min-height: 2.7em;
}
.card-sub{
  margin:8px 0 0;
  color:var(--muted);
  font-size:.86rem;
}

.pill-row{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:18px;}
.notice{
  width:100%;
  text-align:center;
  padding:18px 10px;
  color:var(--muted);
}
.skeleton{
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.04);
}
.skeleton .poster{background:rgba(255,255,255,.04)}
.skeleton .card-body{padding:12px}
.skeleton .line{
  height:12px; border-radius:8px;
  margin:10px auto 0;
  width:78%;
  background:rgba(255,255,255,.06);
}
.skeleton .line.sm{width:58%}
.shimmer{
  position:relative;
}
.shimmer:before{
  content:"";
  position:absolute; inset:-1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
  transform:translateX(-120%);
  animation:shimmer 1.2s infinite;
}
@keyframes shimmer{to{transform:translateX(120%)}}

.player-wrap{
  background:linear-gradient(to bottom, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}
.cinema-screen{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}
.cinema-screen iframe{width:100%; height:100%; border:none;}
.servers-area{margin-top:18px; text-align:center}
.srv-list{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:10px;}
.srv-btn{
  background:rgba(255,255,255,.06);
  color:#ddd;
  border:1px solid rgba(255,255,255,.14);
  padding:10px 16px;
  cursor:pointer;
  border-radius:999px;
  font-weight:800;
  transition:.15s;
}
.srv-btn:hover{transform:translateY(-1px); background:rgba(255,255,255,.08)}
.srv-btn.active{
  background:rgba(229,9,20,.18);
  border-color:rgba(229,9,20,.55);
  color:#fff;
}

.telegram-float{
  position:fixed; bottom:20px; right:20px;
  background:linear-gradient(45deg, #229ED9, #1c79a8);
  color:white;
  padding:12px 22px;
  border-radius:999px;
  display:flex; align-items:center; gap:10px;
  text-decoration:none;
  box-shadow:0 5px 20px rgba(34, 158, 217, 0.5);
  z-index:1000; font-weight:900;
}
.telegram-float:hover{filter:brightness(1.05)}
.telegram-icon{width:24px; height:24px; fill:white}

.footer{
  padding:26px 0 40px;
  text-align:center;
  color:rgba(255,255,255,.55);
  font-size:.9rem;
}

.poster.thumb{padding-top:56.25%}


/* --- Safety for ads/embeds --- */
img, iframe, video { max-width: 100%; height: auto; }
iframe { display:block; }
body { overflow-x:hidden; }

  <script>
if(!window.DS){
// assets/site.js
(function () {
  "use strict";

  const CFG = window.DS_CONFIG || {};

  // -------------------------
  // Utils
  // -------------------------
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function escapeHtml(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function cleanSeriesName(title) {
    if (!title) return "";
    let t = String(title);
    // إزالة "مسلسل" و "الحلقة ..." إن وجدت
    t = t.split("الحلقة")[0];
    t = t.replace("مسلسل", "").trim();
    return t;
  }

  // -------------------------
  // Fetch JSON with fallback + timeout
  // -------------------------
  async function fetchWithTimeout(url, { timeout = 12000 } = {}) {
    const ctrl = new AbortController();
    const id = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
      return res;
    } finally {
      clearTimeout(id);
    }
  }

  async function fetchJsonFromSources(urls) {
    let lastErr;
    for (const url of urls) {
      try {
        const res = await fetchWithTimeout(url, { timeout: 15000 });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (e) {
        lastErr = e;
        // تهدئة بسيطة لتجنب Rate limit
        await sleep(120);
      }
    }
    throw lastErr || new Error("Failed to fetch JSON");
  }

  // -------------------------
  // Image Proxy helpers
  // -------------------------
  function normalizeUrl(url) {
    if (!url) return "";
    let u = String(url).trim();
    if (u.startsWith("//")) u = "https:" + u;
    return u;
  }

  function stripProtocol(url) {
    // weserv تشتغل أفضل عندما يكون url بدون بروتوكول
    try {
      const u = new URL(url);
      return u.host + u.pathname + u.search;
    } catch {
      return url.replace(/^https?:\/\//, "");
    }
  }

  function buildImageCandidates(originalUrl, { w = 300, h = 450, fit = "cover" } = {}) {
    const url = normalizeUrl(originalUrl);
    if (!url) return [CFG.PLACEHOLDER_POSTER].filter(Boolean);

    const noProto = stripProtocol(url);

    // الترتيب: weserv -> wsrv -> direct
    const c1 = `https://images.weserv.nl/?url=${encodeURIComponent(noProto)}&w=${w}&h=${h}&fit=${fit}`;
    const c2 = `https://wsrv.nl/?url=${encodeURIComponent(url)}&w=${w}&h=${h}&fit=${fit}`;
    const c3 = url;

    return [c1, c2, c3].filter(Boolean);
  }

  function attachProgressiveImage(img, candidates, placeholder) {
    let i = 0;
    img.referrerPolicy = "no-referrer";
    img.decoding = "async";
    img.loading = "lazy";

    function tryNext() {
      if (i >= candidates.length) {
        img.src = placeholder || CFG.PLACEHOLDER_POSTER || "";
        img.classList.add("loaded");
        return;
      }
      img.src = candidates[i++];
    }

    img.addEventListener("load", () => img.classList.add("loaded"), { once: true });
    img.addEventListener("error", () => tryNext());

    // start
    tryNext();
  }

  // -------------------------
  // Lazy load via IntersectionObserver
  // -------------------------
  const io = ("IntersectionObserver" in window)
    ? new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          const img = e.target;
          io.unobserve(img);
          const candidates = JSON.parse(img.dataset.candidates || "[]");
          const placeholder = img.dataset.placeholder || "";
          attachProgressiveImage(img, candidates, placeholder);
        }
      }, { rootMargin: "450px" })
    : null;

  function lazyMountImage(img, candidates, placeholder) {
    img.dataset.candidates = JSON.stringify(candidates);
    img.dataset.placeholder = placeholder || "";
    // ضع placeholder الآن لتجنب فراغ
    img.src = placeholder || CFG.PLACEHOLDER_POSTER || "";
    if (io) io.observe(img);
    else attachProgressiveImage(img, candidates, placeholder);
  }

  // -------------------------
  // Concurrency limit
  // -------------------------
  function pLimit(concurrency) {
    const queue = [];
    let activeCount = 0;

    const next = () => {
      activeCount--;
      if (queue.length > 0) {
        queue.shift()();
      }
    };

    const run = async (fn, resolve, reject) => {
      activeCount++;
      try {
        const result = await fn();
        resolve(result);
      } catch (error) {
        reject(error);
      } finally {
        next();
      }
    };

    return (fn) =>
      new Promise((resolve, reject) => {
        const task = () => run(fn, resolve, reject);
        if (activeCount < concurrency) task();
        else queue.push(task);
      });
  }

  // -------------------------
  // Public API
  // -------------------------
  window.DS = {
    CFG,
    $,
    $$,
    escapeHtml,
    cleanSeriesName,
    fetchJsonFromSources,
    buildImageCandidates,
    lazyMountImage,
    pLimit,
  };
})();

}

  </script>

  <div class="hero">

        </div>
        <a class="btn" href="series.html">أحدث الحلقات</a>

      <div id="grid" class="grid" aria-live="polite"></div>

    <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.62 0zm4.91 5.6c.04 0 .09.01.13.02.34.09.53.48.43.82l-2.4 11.2c-.05.23-.23.41-.46.46-.35.08-.7-.14-.78-.49l-1.4-5.6-4.6 3.4c-.2.15-.48.14-.66-.03-.18-.17-.22-.45-.1-.66L8.8 9.6l-4.5-1.4c-.33-.1-.52-.46-.42-.8.09-.31.4-.49.71-.41l12.26 4.6zM9.8 10.6l1.2 4.4.9-3.8z"/></svg>

  <script src="assets/config.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const CFG = window.DS_CONFIG;
    const DS = window.DS;

    const grid = DS.$('#grid');
    const statusText = DS.$('#status-text');
    const progressBadge = DS.$('#progress-badge');
    const loadedBadge = DS.$('#loaded-badge');
    const totalSpan = DS.$('#total-series');
    const searchInput = DS.$('#search');
    const btnRetry = DS.$('#btn-retry');
    const sentinel = DS.$('#sentinel');

    const total = Number(CFG.LIB_TOTAL_SERIES || 137);
    totalSpan.textContent = String(total);

    let nextId = 1;
    let loadedCount = 0;
    let loading = false;
    let stop = false;

    // ماب للأسماء للبحث السريع
    const cardsById = new Map();

    function setStatus(msg){ statusText.textContent = msg; }

    function createSkeletonCard(){
      const sk = document.createElement('div');
      sk.className = 'skeleton shimmer';
      sk.innerHTML = `
        <div class="poster"></div>
        <div class="card-body">
          <div class="line"></div>
          <div class="line sm"></div>
        </div>
      `;
      return sk;
    }

    function applyFilter(){
      const q = (searchInput.value || '').trim().toLowerCase();
      for (const [id, obj] of cardsById.entries()){
        const show = !q || obj.name.toLowerCase().includes(q);
        obj.el.style.display = show ? '' : 'none';
      }
    }

    async function fetchSeriesCard(id){
      const sources = (CFG.SERIES_JSON_SOURCES || []).map(s => s.replace('{ID}', id));
      const data = await DS.fetchJsonFromSources(sources);

      const firstEp = data && data[0] ? data[0] : null;
      const rawTitle = firstEp ? firstEp.title : `مسلسل رقم ${id}`;
      const name = DS.cleanSeriesName(rawTitle) || `مسلسل رقم ${id}`;

      const originalImage = firstEp && firstEp.thumbnail ? firstEp.thumbnail : '';
      const candidates = DS.buildImageCandidates(originalImage, {w:300, h:450, fit:'cover'});

      const card = document.createElement('div');
      card.className = 'card';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.onclick = () => {
        window.location.href = `episodes.html?id=${id}&name=${encodeURIComponent(name)}`;
      };
      card.onkeydown = (e) => {
        if(e.key === 'Enter' || e.key === ' ') card.click();
      };

      const poster = document.createElement('div');
      poster.className = 'poster';

      const img = document.createElement('img');
      img.alt = name;

      DS.lazyMountImage(img, candidates, CFG.PLACEHOLDER_POSTER);

      poster.appendChild(img);

      const body = document.createElement('div');
      body.className = 'card-body';
      body.innerHTML = `
        <h3 class="card-title">${DS.escapeHtml(name)}</h3>
        <p class="card-sub">اضغط لعرض الحلقات</p>
      `;

      card.appendChild(poster);
      card.appendChild(body);

      return { el: card, name };
    }

    async function loadNextBatch(batchSize = 12){
      if (loading || stop) return;
      if (nextId > total) { stop = true; sentinel.textContent = 'تم تحميل كل المسلسلات ✅'; return; }

      loading = true;
      setStatus('جاري تحميل المزيد…');

      const limit = DS.pLimit(6);

      // Skeletons أولاً
      const placeholders = [];
      const startId = nextId;
      const endId = Math.min(total, nextId + batchSize - 1);
      for (let id = startId; id <= endId; id++){
        const sk = createSkeletonCard();
        placeholders.push({ id, sk });
        grid.appendChild(sk);
      }

      const tasks = [];
      for (let id = startId; id <= endId; id++){
        tasks.push(limit(async () => {
          try{
            const cardObj = await fetchSeriesCard(id);
            return { id, ok:true, cardObj };
          }catch(e){
            return { id, ok:false, err: e };
          }
        }));
      }

      const results = await Promise.all(tasks);

      // استبدال الـ skeleton بالكروت
      for (const r of results){
        const ph = placeholders.find(p => p.id === r.id);
        if (!ph) continue;

        if (r.ok){
          ph.sk.replaceWith(r.cardObj.el);
          cardsById.set(r.id, { el: r.cardObj.el, name: r.cardObj.name });
          loadedCount++;
        }else{
          // في حالة فشل تحميل JSON: نعرض كارت placeholder بدل ما الشبكة تفضل معلقة
          const fallback = document.createElement('div');
          fallback.className = 'card';
          fallback.onclick = () => window.location.href = `episodes.html?id=${r.id}&name=${encodeURIComponent('مسلسل رقم ' + r.id)}`;
          fallback.innerHTML = `
            <div class="poster">
              <img alt="Design Society" class="loaded" src="${CFG.PLACEHOLDER_POSTER}">
            </div>
            <div class="card-body">
              <h3 class="card-title">مسلسل رقم ${r.id}</h3>
              <p class="card-sub">تعذر جلب البيانات الآن</p>
            </div>
          `;
          ph.sk.replaceWith(fallback);
          cardsById.set(r.id, { el: fallback, name: `مسلسل رقم ${r.id}` });
          loadedCount++;
        }
      }

      nextId = endId + 1;

      progressBadge.textContent = `${loadedCount}/${total}`;
      loadedBadge.textContent = String(loadedCount);

      applyFilter();

      setStatus(stop ? 'تم التحميل' : 'جاهز');
      loading = false;

      if (nextId > total){
        stop = true;
        sentinel.textContent = 'تم تحميل كل المسلسلات ✅';
      }
    }

    // sentinel infinite load
    const io = new IntersectionObserver((entries) => {
      if(entries.some(e => e.isIntersecting)){
        loadNextBatch(12);
      }
    }, { rootMargin: '800px' });
    io.observe(sentinel);

    searchInput.addEventListener('input', applyFilter);
    btnRetry.addEventListener('click', () => loadNextBatch(12));

    // first load
    setStatus('جاري التحميل…');
    loadNextBatch(18);
  </script>
</body>
</html>
