<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Design Society - مكتبة المسلسلات</title>
    <script src="https://quge5.com/88/tag.min.js" data-zone="207660" async data-cfasync="false"></script>
    <style>
        :root { --primary: #e50914; --bg: #141414; --card-bg: #1f1f1f; }
        body { background-color: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .hero { text-align: center; padding: 60px 20px; background: linear-gradient(to bottom, #000, var(--bg)); border-bottom: 2px solid var(--primary); }
        .hero h1 { color: var(--primary); font-size: 3rem; margin: 0; }
        
        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        
        .card { 
            background: var(--card-bg); border-radius: 8px; overflow: hidden; 
            transition: transform 0.3s; cursor: pointer; position: relative; 
            border: 1px solid #333; height: 100%;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); }
        
        .poster-container {
            width: 100%;
            padding-top: 140%; /* يحافظ على نسبة البوستر */
            position: relative;
            background: #222; /* لون الخلفية قبل تحميل الصورة */
        }
        
        .card img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; opacity: 0; transition: opacity 0.5s;
        }
        
        /* الصورة تظهر بـ Fade-in لما تتحمل */
        .card img.loaded { opacity: 1; }

        .card-content { padding: 15px; text-align: center; }
        .card-title { font-size: 1rem; font-weight: bold; margin: 0; color: #eee; }
        
        .loader { text-align: center; padding: 40px; color: #666; width: 100%; grid-column: 1/-1; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Design Society Drama</h1>
        <p>شاهد أحدث المسلسلات التركية (137 مسلسل)</p>
    </div>

    <div class="container">
        <div id="series-grid" class="grid">
            <div class="loader">جاري تحميل المكتبة...</div>
        </div>
    </div>

    <script>
        const baseUrl = "https://raw.githubusercontent.com/AhmedKammel/jsondata/refs/heads/main/mosalsal{ID}.json";
        const totalSeries = 137;
        const grid = document.getElementById('series-grid');
        const fallbackImage = "https://via.placeholder.com/300x450/111/e50914?text=Design+Society";

        // 1. إعداد مراقب الصور (Intersection Observer) للتحميل الكسول (Lazy Loading)
        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    // نقل الرابط من data-src إلى src لبدء التحميل الفعلي
                    img.src = img.dataset.src;
                    // إيقاف مراقبة هذه الصورة لأنها بدأت التحميل
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: "200px" }); // يبدأ التحميل قبل وصول الصورة للشاشة بـ 200 بيكسل

        // 2. دالة تنظيف الرابط واستخدام البروكسي (Weserv)
        function buildProxyImage(originalImage) {
            if (!originalImage) return fallbackImage;
            let url = originalImage.trim();

            // إزالة البروتوكول (http/https) لتجنب مشاكل Weserv
            url = url.replace(/^https?:\/\//, '');

            // استخدام images.weserv.nl لكسر الحماية + تحويل الصورة لـ WebP لسرعة أكبر
            return `https://images.weserv.nl/?url=${encodeURIComponent(url)}&w=300&h=450&fit=cover&output=webp`;
        }

        async function fetchSeries(id) {
            try {
                const url = baseUrl.replace('{ID}', id);
                const res = await fetch(url);
                if(!res.ok) return null;
                
                const data = await res.json();
                const firstEp = data[0]; 
                
                let cleanName = firstEp.title.split('الحلقة')[0].replace('مسلسل', '').trim();
                
                // تجهيز رابط البروكسي
                const proxyImage = buildProxyImage(firstEp.thumbnail);

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => window.location.href = `episodes.html?id=${id}&name=${encodeURIComponent(cleanName)}`;
                
                // بناء عنصر الصورة باستخدام Lazy Loading
                // لاحظ: وضعنا الرابط الحقيقي في data-src
                card.innerHTML = `
                    <div class="poster-container">
                        <img 
                            alt="${cleanName}" 
                            data-src="${proxyImage}" 
                            src="${fallbackImage}"
                            referrerpolicy="no-referrer"
                            onload="this.classList.add('loaded')"
                            onerror="this.src='${fallbackImage}'; this.classList.add('loaded');"
                        >
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${cleanName}</h3>
                    </div>
                `;
                
                // تسجيل الصورة في المراقب
                const imgElement = card.querySelector('img');
                imageObserver.observe(imgElement);

                return card;

            } catch (e) {
                return null;
            }
        }

        async function loadLibrary() {
            grid.innerHTML = ''; 
            // سنحاول تحميل عدد أكبر قليلاً في كل دفعة لأن الصور لن تُحمل فعلياً إلا عند الظهور
            const batchSize = 15; 
            
            for (let i = 1; i <= totalSeries; i += batchSize) {
                const promises = [];
                for (let j = i; j < i + batchSize && j <= totalSeries; j++) {
                    promises.push(fetchSeries(j));
                }
                const cards = await Promise.all(promises);
                cards.forEach(c => { if(c) grid.appendChild(c); });
            }
        }

        loadLibrary();
    </script>
    <script src="tracking.js"></script>
</body>
</html>
